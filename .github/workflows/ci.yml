name: FIRBO OSS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/orchestrator/requirements.txt pytest
      - run: python -m pytest -q tests/test_orchestrator.py
