name: FIRBO OSS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  orchestrator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/orchestrator/requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -m py_compile services/browser-mcp/firbo_browser_route.py
      - run: bash -n scripts/bootstrap.sh scripts/dev-up.sh scripts/dev-down.sh scripts/doctor.sh scripts/install-browser-mcp.sh scripts/accept-selfhosted-browser.sh scripts/deploy-browser-route-only.sh scripts/deploy-browser-route-without-checkout.sh
      - run: node --check services/browser-mcp/server.mjs && node --check services/browser-mcp/create-session.mjs
      - run: |
          node services/browser-mcp/create-session.mjs | node --input-type=module -e '
            let data="";
            process.stdin.on("data",c=>data+=c);
            process.stdin.on("end",()=>{
              const v=JSON.parse(data);
              if(v.contract!=="firbo-browser-session/v1") process.exit(1);
              if(v.provider!=="selfhosted-playwright") process.exit(1);
              if(!/^[0-9a-f-]{36}$/i.test(v.session_id)) process.exit(1);
              console.log("SELFHOSTED_SESSION_CONTRACT_PASS");
            });'
      - run: |
          if grep -R -nE '@browserbase|BROWSERBASE_API_KEY|bb\.agents|browserbase\.connect|browserbase\.launch' services/browser-mcp scripts/install-browser-mcp.sh; then
            echo "Browserbase dependency leaked into primary self-hosted runtime"
            exit 1
          fi
      - run: |
          if grep -A 20 'new AsyncFunction' services/browser-mcp/server.mjs | grep -Eq '"(eval|arguments)"'; then
            echo "Forbidden strict-mode AsyncFunction binding found"
            exit 1
          fi
          node --input-type=module -e 'const A=Object.getPrototypeOf(async function(){}).constructor; new A("page","context","console","process","require","fetch","globalThis","Function","WebSocket","\"use strict\"; return 1;"); console.log("STRICT_ASYNC_FUNCTION_PASS")'
